<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Mang Deden</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#1a6b42;--g2:#28a05f;--g3:#3dbd7a;
  --gold:#f5a623;--gold2:#ffd166;
  --dark:#071510;--mid:#163025;--soft:#f2f8f5;
  --white:#fff;--gray:#7a9285;--light:#e8f3ec;--border:#cde8d9;
  --red:#e03c3c;--blue:#1a6fa4;--orange:#e67e22;--purple:#6f42c1;
  --r:16px;--rs:12px;--sh:0 2px 14px rgba(26,107,66,.08);--sh2:0 8px 24px rgba(26,107,66,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--soft);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{cursor:pointer;font-family:inherit;border:none;}

/* AUTH */
#authWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,var(--dark) 0%,var(--mid) 45%,var(--g1) 100%);padding:20px;position:relative;overflow:hidden;}
#authWrap::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(61,189,122,.15);top:-100px;right:-100px;filter:blur(40px);}
#authWrap::after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:rgba(245,166,35,.15);bottom:-80px;left:-80px;filter:blur(40px);}
.auth-box{background:#fff;border-radius:24px;padding:34px 26px 28px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative;z-index:2;}
.brand{text-align:center;margin-bottom:24px;}
.brand-ico{width:74px;height:74px;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 12px 28px rgba(26,107,66,.4);}
.brand h1{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand p{font-size:11px;color:var(--gray);margin-top:4px;font-weight:500;}
.tabs{display:flex;background:#f0f7f3;border-radius:12px;padding:4px;margin-bottom:16px;}
.tab{flex:1;padding:10px;background:transparent;border-radius:9px;font-size:13px;font-weight:700;color:var(--gray);transition:all .25s;}
.tab.on{background:#fff;color:var(--g1);box-shadow:0 2px 6px rgba(0,0,0,.08);}
.ain{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:12px;font-size:14px;outline:none;margin-bottom:10px;background:#fafafa;transition:all .2s;}
.ain:focus{border-color:var(--g2);background:#fff;box-shadow:0 0 0 4px rgba(40,160,95,.1);}
.btn-prim{width:100%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px;border-radius:12px;font-size:14px;font-weight:700;margin-top:6px;box-shadow:0 6px 16px rgba(26,107,66,.25);transition:all .2s;}
.demo-hint{font-size:10px;color:var(--gray);text-align:center;margin-top:12px;padding:8px;background:#f6f6f6;border-radius:8px;}

/* HEADER */
.h-bar{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:16px 18px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.1);}
.h-brand{display:flex;align-items:center;gap:11px;}
.h-ico{width:42px;height:42px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.h-name{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;}
.h-tag{font-size:10px;opacity:.85;margin-top:2px;}
.h-actions{display:flex;align-items:center;gap:8px;}
.cb-pill{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#4a3400;padding:7px 13px;border-radius:50px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(245,166,35,.4);}
.icon-btn{background:rgba(255,255,255,.18);width:38px;height:38px;border-radius:12px;font-size:16px;color:#fff;}
.m-cont{padding:14px;padding-bottom:90px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--border);z-index:50;box-shadow:0 -4px 14px rgba(0,0,0,.05);}
.bn-i{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px 11px;gap:3px;color:var(--gray);font-size:9px;font-weight:700;cursor:pointer;position:relative;}
.bn-i span:first-child{font-size:20px;}
.bn-i.on{color:var(--g1);}
.bn-i.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:3px;background:var(--g1);border-radius:0 0 3px 3px;}
.bn-i em{position:absolute;top:5px;right:22%;background:var(--red);color:#fff;font-size:9px;padding:1px 6px;border-radius:50px;font-style:normal;font-weight:700;min-width:18px;text-align:center;}

/* CARDS */
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;}
.card-t{font-family:'Sora',sans-serif;font-size:13px;font-weight:800;margin-bottom:12px;}

/* BANNER */
.banner{background:linear-gradient(135deg,#1a6b42 0%,#28a05f 50%,#3dbd7a 100%);color:#fff;border-radius:18px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;}
.banner::before{content:"💰";position:absolute;font-size:120px;right:-20px;top:50%;transform:translateY(-50%);opacity:.1;}
.banner h2{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;margin-bottom:4px;position:relative;}
.banner p{font-size:12px;opacity:.95;line-height:1.5;position:relative;}
.banner .badge{display:inline-block;background:var(--gold);color:#4a3400;padding:3px 10px;border-radius:50px;font-size:10px;font-weight:800;margin-bottom:8px;}

/* QUICK SERVICES */
.qs-section{margin-bottom:14px;}
.qs-section-t{font-family:'Sora',sans-serif;font-size:13px;font-weight:800;margin-bottom:10px;padding-left:4px;}
.qs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.qs-i{background:#fff;border-radius:16px;padding:16px 6px;text-align:center;cursor:pointer;box-shadow:var(--sh);transition:all .25s;}
.qs-i:hover{transform:translateY(-3px);box-shadow:var(--sh2);}
.qs-i .ico-wrap{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:22px;}
.qs-i[data-c="1"] .ico-wrap{background:linear-gradient(135deg,#dbeeff,#a8d5ff);}
.qs-i[data-c="2"] .ico-wrap{background:linear-gradient(135deg,#fff1d8,#ffd166);}
.qs-i[data-c="3"] .ico-wrap{background:linear-gradient(135deg,#d4f5e3,#7eddb0);}
.qs-i[data-c="4"] .ico-wrap{background:linear-gradient(135deg,#fde0d3,#f5a380);}
.qs-i .qs-lbl{font-size:11px;font-weight:700;}

/* CATEGORY */
.cat-bar{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding:4px 0 6px;-webkit-overflow-scrolling:touch;}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-chip{padding:8px 16px;border-radius:50px;background:#fff;font-size:12px;font-weight:600;color:var(--gray);white-space:nowrap;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;}
.cat-chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(26,107,66,.25);}

/* PRODUCT */
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.prod-card{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);position:relative;transition:all .25s;}
.prod-card:hover{transform:translateY(-2px);box-shadow:var(--sh2);}
.prod-ico{font-size:48px;text-align:center;padding:18px 0;background:linear-gradient(135deg,var(--light),var(--soft));border-radius:13px;margin-bottom:9px;}
.prod-name{font-size:12px;font-weight:700;margin-bottom:3px;line-height:1.3;min-height:32px;}
.prod-price{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;color:var(--g1);}
.prod-stk{font-size:10px;color:var(--gray);margin:2px 0 8px;}
.prod-add{width:100%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:8px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 3px 8px rgba(26,107,66,.2);}
.prod-add:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;}
.prod-badge{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--red),#ff6b6b);color:#fff;padding:3px 8px;border-radius:50px;font-size:9px;font-weight:800;box-shadow:0 3px 8px rgba(224,60,60,.3);}
.prod-badge.digital{background:linear-gradient(135deg,var(--purple),#9c27b0);}
.prod-card .ci-qty{display:flex;align-items:center;justify-content:space-between;background:var(--light);border-radius:10px;padding:4px 8px;}
.prod-card .ci-qb{width:24px;height:24px;background:var(--g1);color:#fff;border-radius:6px;font-weight:800;font-size:14px;}
.prod-card .ci-qv{font-size:13px;font-weight:800;color:var(--g1);}

/* WALLET */
.wallet-hero{background:linear-gradient(135deg,#4a3400 0%,#8b6a1a 40%,var(--gold) 80%,var(--gold2) 100%);color:#fff;border-radius:18px;padding:22px;margin-bottom:12px;position:relative;overflow:hidden;}
.wallet-hero::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1);top:-60px;right:-40px;}
.wallet-hero h3{font-size:11px;font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:2px;position:relative;}
.wallet-hero .bal{font-family:'Sora',sans-serif;font-size:34px;font-weight:800;margin:4px 0;position:relative;}
.wallet-hero .sub{font-size:11px;opacity:.9;position:relative;}
.wallet-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;}
.wa-btn{background:rgba(255,255,255,.22);color:#fff;padding:10px 4px;border-radius:11px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;}
.wa-btn span:first-child{font-size:18px;}
.saving-card{background:linear-gradient(135deg,#0f3960 0%,#1a4d7a 50%,var(--blue) 100%);color:#fff;border-radius:18px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden;}
.saving-card::before{content:"🏦";position:absolute;font-size:100px;right:-15px;bottom:-25px;opacity:.1;}
.saving-card h3{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:2px;position:relative;}
.saving-card .bal{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;margin:4px 0;position:relative;}
.saving-actions{display:flex;gap:8px;margin-top:12px;position:relative;}
.sa-btn{flex:1;background:rgba(255,255,255,.22);color:#fff;padding:9px;border-radius:10px;font-size:12px;font-weight:700;}

/* CART */
.cart-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #f0f4f1;align-items:center;}
.ci-ico{width:50px;height:50px;background:linear-gradient(135deg,var(--light),var(--soft));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.ci-info{flex:1;}
.ci-name{font-size:13px;font-weight:700;}
.ci-price{font-size:11px;color:var(--gray);margin-top:2px;}
.ci-qty{display:flex;align-items:center;gap:6px;background:var(--light);border-radius:10px;padding:3px 6px;}
.ci-qb{width:26px;height:26px;border-radius:7px;background:#fff;color:var(--g1);font-weight:800;font-size:14px;border:1px solid var(--border);}
.ci-qv{min-width:22px;text-align:center;font-size:13px;font-weight:800;color:var(--g1);}

.summary{background:linear-gradient(135deg,var(--soft),#fff);border-radius:14px;padding:14px;margin-top:14px;border:1px solid var(--border);}
.sm-r{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;}
.sm-r.tot{border-top:2px solid var(--border);margin-top:8px;padding-top:10px;font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:var(--g1);}
.sm-r.cb{color:#a06000;font-weight:700;}
.sm-r.wal{color:var(--blue);font-weight:700;}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.tg{position:relative;display:inline-block;width:44px;height:24px;}
.tg input{opacity:0;width:0;height:0;}
.tg-sl{position:absolute;inset:0;background:#ccc;border-radius:50px;cursor:pointer;transition:.3s;}
.tg-sl:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.tg input:checked + .tg-sl{background:var(--g1);}
.tg input:checked + .tg-sl:before{transform:translateX(20px);}

.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.pay-opt{padding:11px 8px;border:2px solid var(--border);border-radius:11px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;background:#fff;}
.pay-opt.on{border-color:var(--g1);background:linear-gradient(135deg,#edf7f1,#fff);color:var(--g1);box-shadow:0 4px 12px rgba(26,107,66,.15);}

/* HISTORY */
.hist-row{padding:13px 0;border-bottom:1px solid #f0f4f1;display:flex;justify-content:space-between;align-items:center;}
.hist-row:last-child{border-bottom:none;}
.hist-info{flex:1;}
.hist-title{font-size:13px;font-weight:700;}
.hist-date{font-size:10px;color:var(--gray);margin-top:3px;}
.hist-amt{font-family:'Sora',sans-serif;font-weight:800;font-size:14px;}
.hist-amt.in{color:var(--g1);}
.hist-amt.out{color:var(--red);}

/* MODAL */
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.mwrap.on{display:flex;}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:24px 22px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative;}
.modal h3{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;margin-bottom:16px;}
.m-close{position:absolute;top:14px;right:14px;background:#f0f0f0;width:32px;height:32px;border-radius:50%;font-size:14px;color:var(--gray);}

/* BADGES */
.bdg{display:inline-block;padding:3px 10px;border-radius:50px;font-size:10px;font-weight:800;}
.bdg-green{background:#d4f5e3;color:#1a6b42;}
.bdg-gold{background:#fdf3d0;color:#a06000;}
.bdg-blue{background:#dbeeff;color:#1a6fa4;}
.bdg-red{background:#ffe0e0;color:#c0392b;}
.bdg-orange{background:#fdebd0;color:#a04000;}

.empty{text-align:center;padding:36px 20px;color:var(--gray);font-size:12px;}
.empty span{font-size:54px;display:block;margin-bottom:10px;opacity:.6;}

/* TAB-BAR */
.tab-bar{display:flex;background:#fff;border-radius:14px;padding:5px;margin-bottom:12px;gap:3px;box-shadow:var(--sh);}
.tab-bar button{flex:1;padding:9px;background:transparent;border-radius:10px;font-size:11px;font-weight:700;color:var(--gray);transition:all .2s;}
.tab-bar button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 10px rgba(26,107,66,.25);}

.pawn-item{background:#fff;border-radius:13px;padding:13px;margin-bottom:9px;border-left:4px solid var(--gold);box-shadow:var(--sh);}
.pawn-item.approved{border-color:var(--g1);}
.pawn-item.rejected{border-color:var(--red);}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.stat-mini{background:linear-gradient(135deg,var(--soft),#fff);border-radius:13px;padding:13px;text-align:center;border:1px solid var(--border);}
.stat-mini-val{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;}
.stat-mini-lbl{font-size:10px;color:var(--gray);margin-top:2px;font-weight:600;}

.profile-hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:18px;padding:24px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden;}
.profile-hero::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);top:-80px;left:-50px;}
.profile-avatar{width:80px;height:80px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 10px;border:3px solid rgba(255,255,255,.3);position:relative;}
.profile-name{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;position:relative;}
.profile-phone{font-size:12px;opacity:.9;margin-top:3px;position:relative;}

.info-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f4f1;}
.info-row:last-child{border-bottom:none;}

/* Widget Cashback Beranda */
.cb-widget{background:linear-gradient(135deg,#4a3400,#8b6a1a 40%,var(--gold) 80%,var(--gold2));border-radius:18px;padding:16px 18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden;}
.cb-widget::before{content:"💰";position:absolute;font-size:100px;right:-15px;bottom:-20px;opacity:.12;}
.cb-widget-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;opacity:.85;margin-bottom:4px;}
.cb-widget-bal{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;margin-bottom:10px;}
.cb-widget-row{display:flex;gap:8px;}
.cb-mini{flex:1;background:rgba(255,255,255,.18);border-radius:11px;padding:10px;text-align:center;backdrop-filter:blur(8px);}
.cb-mini-val{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;}
.cb-mini-lbl{font-size:9px;opacity:.85;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.cb-potential{background:rgba(255,255,255,.22);border-radius:11px;padding:10px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
.cb-potential-lbl{font-size:11px;opacity:.9;}
.cb-potential-val{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;}
.info-lbl{font-size:12px;color:var(--gray);font-weight:600;}
.info-val{font-size:13px;font-weight:700;}
</style>
</head>
<body>
<div id="syncStatus" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#28a05f;color:#fff;font-size:11px;font-weight:700;padding:5px 14px;align-items:center;gap:6px;justify-content:center;"></div>
<div id="authWrap">
  <div class="auth-box">
    <div class="brand">
      <div class="brand-ico" id="adminTrigger" onclick="handleAdminTap()" style="cursor:pointer;">🏪</div>
      <h1>Warung Mang Deden</h1>
      <p>Sembako · Dompet · Gadai · Transfer</p>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="aTab('login',this)">Masuk</button>
      <button class="tab" onclick="aTab('reg',this)">Daftar Baru</button>
    </div>
    <div id="loginF" style="display:block;">
      <input class="ain" id="lPhone" type="tel" inputmode="numeric" placeholder="Nomor WhatsApp">
      <input class="ain" id="lPin" type="number" inputmode="numeric" placeholder="PIN 6 Digit" style="letter-spacing:6px;font-size:22px;text-align:center;font-weight:700;-webkit-text-security:disc;font-family:'Sora',sans-serif;" oninput="if(this.value.length>6)this.value=this.value.slice(0,6)">
      <button class="btn-prim" onclick="doLogin()">🔐 Masuk</button>
      <p class="demo-hint">Demo: 081234567890 / PIN 123456</p>
    </div>
    <div id="regF" style="display:none;">
      <input class="ain" id="rName" type="text" placeholder="Nama Lengkap">
      <input class="ain" id="rPhone" type="tel" inputmode="numeric" placeholder="Nomor WhatsApp">
      <input class="ain" id="rAddr" type="text" placeholder="Alamat (untuk antar)">
      <input class="ain" id="rPin" type="number" inputmode="numeric" placeholder="Buat PIN 6 Digit" style="letter-spacing:6px;font-size:22px;text-align:center;font-weight:700;-webkit-text-security:disc;font-family:'Sora',sans-serif;" oninput="if(this.value.length>6)this.value=this.value.slice(0,6)">
      <button class="btn-prim" onclick="doReg()">✨ Daftar</button>
    </div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <header class="h-bar">
    <div class="h-brand">
      <div class="h-ico">🏪</div>
      <div>
        <div class="h-name">Warung Mang Deden</div>
        <div class="h-tag" id="hdrGreet">Selamat datang!</div>
      </div>
    </div>
    <div class="h-actions">
      <div class="cb-pill" onclick="goPage('wallet')">💰 <span id="hdrCB">Rp 0</span></div>
      <button class="icon-btn" onclick="doLogout2()">🚪</button>
    </div>
  </header>

function renderEtalase() {
  // Ambil dari shared pawn storage (lebih reliable setelah admin approve)
  let allPawns = [];
  try { allPawns = JSON.parse(localStorage.getItem('wmd_pawn_v1')||'[]'); } catch(e) {}
  const items = allPawns.filter(p => p.type === 'jual' && p.status === 'approved');
  // Fallback: cek juga dari user.pawnItems
  if (items.length === 0) {
    const allUsers = loadUsers();
    Object.values(allUsers).forEach(u => {
      (u.pawnItems||[]).forEach(p => {
        if (p.type === 'jual' && p.status === 'approved') {
          items.push({...p, seller: u.name||p.cust, phone: u.phone||p.phone});
        }
      });
    });
  }
  return items;
}

function calcCartCb() {
  const s = loadSets();
  if (!s.cbEnabled) return 0;
  const items = Object.values(cart);
  if (!items.length) return 0;
  const subtotal = items.reduce((a,b) => a + b.price * b.qty, 0);
  const u = getU();
  const walMax = useWalletPay ? Math.min(u?.cbBalance||0, subtotal) : 0;
  const payFrac = subtotal > 0 ? (subtotal - walMax) / subtotal : 1;
  return items.reduce((a, i) => a + Math.round((i.cbRp||0) * i.qty * payFrac), 0);
}

  if (!u || !s.cbEnabled) { el.style.display='none'; return; }

  }).join('') : '<div class="empty" style="grid-column:1/-1;"><span>📦</span>Produk kosong</div>';

function addCart(id, delta) {
  const p = loadProds().find(x=>x.id===id);
  if (!p) return;
  if (!cart[id]) cart[id] = { id, name:p.name, price:p.price, icon:p.icon, img:p.img||'', qty:0, cbRp:p.cbRp||0 };
  cart[id].qty = Math.max(0, cart[id].qty + delta);
  if (cart[id].qty === 0) delete cart[id];
  if (p.stock !== 999 && cart[id] && cart[id].qty > p.stock) {
    cart[id].qty = p.stock;
    alert('Stok ' + p.name + ' hanya ' + p.stock);
  }
  renderProds();
  updHdr();
  renderCbWidget();
}

function checkout() {
  const u = getU(); const s = loadSets();
  const items = Object.values(cart);
  if (items.length === 0) return;
  const subtotal = items.reduce((a,b)=>a+b.price*b.qty, 0);
  // Hitung cashback akumulasi per item (berdasarkan cbRate tiap produk)
  const calcItemCb = (item, payFraction) => {
    if (!s.cbEnabled) return 0;
    return Math.round((item.cbRp||0) * item.qty * payFraction);
  };
  const walMax = useWalletPay ? Math.min(u.cbBalance||0, subtotal) : 0;
  const toPay = subtotal - walMax;
  const payFraction = subtotal > 0 ? toPay / subtotal : 1;
  const cb = s.cbEnabled ? items.reduce((a,i) => a + calcItemCb(i, payFraction), 0) : 0;
  const ordId = oid();
  const payNames = {dana:'DANA',shopeepay:'ShopeePay',bca:'Transfer BCA',cash:'Tunai (COD)'};

  updU(uu => {
    if (walMax > 0) uu.cbBalance = Math.max(0, (uu.cbBalance||0) - walMax);
    if (cb > 0) {
      uu.cbBalance = (uu.cbBalance||0) + cb;
      uu.monthEarned = (uu.monthEarned||0) + cb;
    }
    uu.monthSpend = (uu.monthSpend||0) + subtotal;
    uu.totalSpend = (uu.totalSpend||0) + subtotal;
    if (!uu.txHistory) uu.txHistory = [];
    uu.txHistory.unshift({ id:ordId, type:'order', date:today(), desc:'Belanja ('+items.length+' item)', amount:-toPay });
    if (cb > 0) uu.txHistory.unshift({ id:'CB'+Date.now(), type:'cb', date:today(), desc:'Cashback #'+ordId, amount:cb });
  });

  const prods = loadProds();
  items.forEach(i => {
    const p = prods.find(x=>x.id===i.id);
    if (p && p.stock !== 999) p.stock = Math.max(0, p.stock - i.qty);
  });
  saveProds(prods);

  let msg = `🛒 *PESANAN BARU — Warung Mang Deden*\n\n👤 ${u.name}\n📞 ${u.phone}\n📍 ${u.address||'-'}\n\n*Belanja:*\n`;
  items.forEach(i => {
    const iCbVal = s.cbEnabled ? Math.round((i.cbRp||0) * i.qty * payFraction) : 0;
    msg += `• ${i.name} ×${i.qty} = ${fmt(i.price*i.qty)}${iCbVal>0?' (+CB '+fmt(iCbVal)+')':''}\n`;
  });
  msg += `\n💵 Total: ${fmt(toPay)}\n💳 Metode: ${payNames[selPayMethod]}\n`;
  if (cb > 0) msg += `🎁 Cashback: +${fmt(cb)}${walMax>0?' (dari bagian tunai)':''}\n`;
  if (walMax > 0) msg += `💳 Potong Dompet: ${fmt(walMax)}\n`;
  const shipNames = {'pickup':'Ambil Sendiri','cod':'Antar COD','ojol':'Ojek Online','ekspedisi':'Ekspedisi'};
  msg += `🚚 Pengiriman: ${shipNames[selShipMethod]||selShipMethod}\n📦 No. Pesanan: #${ordId}`;

  // Simpan pesanan ke localStorage agar admin bisa lihat
  try {
    var allOrders = JSON.parse(localStorage.getItem('wmd_orders_v1')||'[]');
    var itemsStr = items.map(i => i.name+' ×'+i.qty).join(', ');
    allOrders.unshift({
      id: ordId,
      cust: u.name,
      phone: u.phone,
      address: u.address||'-',
      items: itemsStr,
      itemsDetail: items.map(i=>({name:i.name,qty:i.qty,price:i.price,subtotal:i.price*i.qty})),
      subtotal: subtotal,
      walPay: walMax,
      total: toPay,
      cb: cb,
      pay: payNames[selPayMethod],
      status: 'baru',
      date: today(),
      ts: Date.now()
    });
    localStorage.setItem('wmd_orders_v1', JSON.stringify(allOrders)); scheduleCloudPush();
  } catch(e) {}

  window.open('https://wa.me/62'+s.waNum.replace(/^0/,'')+'?text='+encodeURIComponent(msg));
  cart = {};
  useWalletPay = false;
  alert('✅ Pesanan terkirim!\nNo. Pesanan: #'+ordId+(cb>0?'\n🎁 Cashback +'+fmt(cb):''));
  goPage('home');
}

let pawnPhotos = [];
function handlePhotoUpload(input) {
  const files = Array.from(input.files);
  const remaining = 3 - pawnPhotos.length;
  const toAdd = files.slice(0, remaining);
  let loaded = 0;
  toAdd.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      // Compress to max 400px wide
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 400;
        const ratio = Math.min(max/img.width, max/img.height, 1);
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(async blob => {
          const name = 'gadai/g' + Date.now() + '_' + Math.floor(Math.random()*1000) + '.jpg';
          try {
            const r = await fetch(SUPA_URL + '/storage/v1/object/produk/' + name, {
              method: 'POST',
              headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'image/jpeg'},
              body: blob
            });
            if (!r.ok) { let t=''; try{ t=await r.text(); }catch(_){} throw new Error('HTTP ' + r.status + ' ' + t.slice(0,160)); }
            pawnPhotos.push(SUPA_URL + '/storage/v1/object/public/produk/' + name);
            renderPhotoPreview();
          } catch (err) {
            alert('⚠️ Upload foto gagal (' + err.message + '). Coba lagi.');
          }
        }, 'image/jpeg', 0.7);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}
function renderPhotoPreview() {
  const el = document.getElementById('photoPreview');
  if (!el) return;
  el.innerHTML = pawnPhotos.map((b64, i) => `

function showSyncStatus(status, msg) {

function supaHeaders(extra) {
  var h = {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json'};
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}

async function supaUpsert(table, rows, onConflict) {
  if (!rows || !rows.length) return true;
  try {
    var r = await fetch(SUPA_URL+'/rest/v1/'+table+'?on_conflict='+onConflict, {
      method: 'POST',
      headers: supaHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify(rows)
    });
    return r.ok;
  } catch(e) { return false; }
}

async function supaSelectAll(table) {
  try {
    var r = await fetch(SUPA_URL+'/rest/v1/'+table+'?select=*', { headers: supaHeaders() });
    if (!r.ok) return [];
    return await r.json();
  } catch(e) { return []; }
}

function getAllLocalData() {
  var data = {};
  LOCAL_KEYS.forEach(function(k) {
    try { data[k] = JSON.parse(localStorage.getItem(k)||'null'); }
    catch(e) { data[k] = null; }
  });
  return data;
}

function setAllLocalData(data) {
  if (!data) return;
  LOCAL_KEYS.forEach(function(k) {
    if (data[k] !== undefined && data[k] !== null) {
      try { localStorage.setItem(k, JSON.stringify(data[k])); }
      catch(e) {}
    }
  });
}

      var s = sets[0];
      localStorage.setItem('wmd_settings_v2', JSON.stringify({
        cbEnabled:s.cb_enabled, cbRate:s.cb_rate, cbBonus:s.cb_bonus, cbThresh:s.cb_thresh,
        minWd:s.min_wd, wdDay:s.wd_day, storeOpen:s.store_open, storeName:s.store_name,
        tagline:s.tagline, themeC1:s.theme_c1, themeC2:s.theme_c2, waNum:s.wa_num, hours:s.hours
      }));
    }

    if (orders.length) localStorage.setItem('wmd_orders_v1', JSON.stringify(orders.map(function(o){ return o.data || o; })));
    if (wds.length) localStorage.setItem('wmd_wd_v1', JSON.stringify(wds.map(function(w){ return w.data || w; })));
    if (tfs.length) localStorage.setItem('wmd_tf_v1', JSON.stringify(tfs.map(function(t){ return t.data || t; })));
    if (pawns.length) localStorage.setItem('wmd_pawn_v1', JSON.stringify(pawns.map(function(p){ return p.data || p; })));

    if (_dataSig() !== _sigBefore) refreshCurrentPage();
    if (!silent) showSyncStatus('ok', 'Tersinkron');
    return true;
  } catch(e) {
    if (!silent) showSyncStatus('err', 'Offline - cek koneksi');
    return false;
  }
}

async function initCloudSync() {
  await pullFromCloud(true);
}
